[package]
name = "rix-shell-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
rix-protocols = { workspace = true, features = ["client"] }
xkbcommon.workspace = true
rix-core = { workspace = true }
slint = { workspace = true, features = ["renderer-software"] }
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["xkbcommon"] }
libc = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
wayland-client = { workspace = true, features = ["system"] }
wayland-egl = "0.32"
i-slint-renderer-femtovg = { version = "=1.17.1", features = ["opengl"] }
wayland-protocols = { workspace = true }
wayland-protocols-wlr = { workspace = true }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }

# Cursor delivery is currently an internal Slint platform API. Keep in lockstep.
i-slint-core = "=1.17.1"

[dev-dependencies]
wayland-server.workspace = true
