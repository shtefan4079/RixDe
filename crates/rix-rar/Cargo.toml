[package]
name = "rix-rar"
version = "0.1.0-alpha.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Isolated Rust RAR reader helper for RixFiles"
[workspace]
[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unrar-rs = { version = "=0.10.8", default-features = false, features = ["crypto-rust"] }
